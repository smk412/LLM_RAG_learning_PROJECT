# Application
spring.application.name=rag-prototype

# Oracle AI Database 26ai
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Gemini chat
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.2

# Gemini embeddings
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# Oracle vector store
spring.ai.vectorstore.oracle.dimensions=768
spring.ai.vectorstore.oracle.distance-type=COSINE
spring.ai.vectorstore.oracle.index-type=NONE
spring.ai.vectorstore.oracle.initialize-schema=true
spring.ai.vectorstore.oracle.remove-existing-vector-store-table=false

# Thymeleaf and file upload
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
